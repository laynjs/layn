<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>layn - Playground</title>
    <meta
      name="description"

      property="og:description"
      content="Try nine virtualized layout algorithms live in your browser."

    <link rel="canonical" href="https://play.layn.io" />

      name="twitter:description"

        document.documentElement.dataset.theme = stored
